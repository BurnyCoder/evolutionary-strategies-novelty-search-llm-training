name: Core scientific invariants
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Record-only scientific checks
        run: uv run pytest -q tests/test_scientific_audit.py tests/test_verification.py tests/test_analysis.py tests/test_reporting.py tests/test_data.py tests/test_publish_corrections.py tests/test_restore_evidence.py
      - name: Full orchestration suite for ordinary development
        if: ${{ !startsWith(github.head_ref || github.ref_name, 'audit/') && !contains(github.event.head_commit.message, '[records-only]') }}
        run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run novelty-es prepare
